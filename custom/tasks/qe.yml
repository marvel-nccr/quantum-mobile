---

- name: Install qe conda environment
  ansible.builtin.include_tasks: local/tasks/conda-env-install.yml
  vars:
    conda_env: qe
    packages:
    - qe=7.5
    - openmpi=4.1.6
    - python=3.13
    - ase
    - numpy
    - matplotlib
    - spglib
    - ipykernel
    - pip
    bin_patterns: ["*.x"]

- name: Install qe-tools via pip
  ansible.builtin.pip:
    name: qe-tools==3.0.0a3
    executable: ~/.conda/envs/qe/bin/pip

- name: Register qe env as Jupyter kernel
  ansible.builtin.command:
    cmd: >
      ~/.conda/envs/qe/bin/python -m ipykernel install --user
      --name qe --display-name "Python (qe)"
    creates: "/home/{{ vm_user }}/.local/share/jupyter/kernels/qe/kernel.json"

- name: Smoke test qe env imports
  ansible.builtin.command:
    cmd: ~/.conda/envs/qe/bin/python -c "import ase, numpy, matplotlib, spglib, qe_tools"
  changed_when: false
