---
# Run as user

- name: Create folder for images
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.file:
    path: "{{ vm_data_folder }}/qm-customizations"
    state: directory
    mode: "0755"

- name: Copy the background image
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.copy:
    src: images/quantum-mobile-bg.png
    dest: "{{ vm_data_folder }}/qm-customizations/quantum-mobile-bg.png"
    mode: "0755"

- name: Set wallpaper
  # Note: This is applied immediately, no restart needed
  community.general.dconf:
    key: /org/gnome/desktop/background/picture-uri
    value: "'file://{{ vm_data_folder }}/qm-customizations/quantum-mobile-bg.png'"
    state: present

- name: Place new desktop icons in the top-left corner
  community.general.dconf:
    key: /org/gnome/shell/extensions/ding/start-corner
    value: "'top-left'"
    state: present

- name: Increase desktop font scaling
  community.general.dconf:
    key: /org/gnome/desktop/interface/text-scaling-factor
    value: "1.25"
    state: present

- name: Copy quamtum-mobile logo
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.copy:
    src: images/quantum-mobile-logo.png
    dest: /usr/share/icons/
    mode: "0644"

- name: Create desktop if not exists
  ansible.builtin.file:
    path: "${HOME}/Desktop"
    state: directory
    mode: "0755"

- name: Copy Firefox .desktop to Desktop
  ansible.builtin.copy:
    src: /var/lib/snapd/desktop/applications/firefox_firefox.desktop
    dest: "/home/{{ vm_user }}/Desktop/firefox_firefox.desktop"
    remote_src: true
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0755"

- name: Create autostart directory
  ansible.builtin.file:
    path: "/home/{{ vm_user }}/.config/autostart"
    state: directory
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0755"

- name: Register trust-desktop-shortcuts autostart entry
  # The metadata::trusted GVFS xattr that GNOME's ding extension requires before
  # it will launch a desktop shortcut does not survive packaging the VM — the
  # imported OVA loses the per-machine GVFS metadata DB on first login, so any
  # trust set during the build is gone by the time the user sees the desktop.
  # Re-apply it on every login via an autostart entry so shortcuts always work.
  ansible.builtin.copy:
    dest: "/home/{{ vm_user }}/.config/autostart/trust-desktop-shortcuts.desktop"
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Trust desktop shortcuts
      Exec=bash -c 'for f in "$HOME/Desktop/"*.desktop; do [ -e "$f" ] && gio set "$f" metadata::trusted true; done'
      X-GNOME-Autostart-enabled=true
      NoDisplay=true
