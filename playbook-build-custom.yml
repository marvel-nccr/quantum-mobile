---
- name: Build base Quantum Mobile layer
  ansible.builtin.import_playbook: playbook-build-base.yml

- name: Install Mini-ASESMA School workshop software
  hosts: "{{ build_hosts | default('vagrant') }}"

  tasks:
  - name: Install qe conda environment
    tags: [qe]
    ansible.builtin.include_tasks:
      file: local/tasks/conda-env-install.yml
      apply:
        become: true
        become_user: "{{ vm_user }}"
        tags: [qe]
    vars:
      conda_env: qe
      packages: [qe=7.5]
      bin_patterns: ["*.x"]

  - name: Install siesta conda environment
    tags: [siesta]
    ansible.builtin.include_tasks:
      file: local/tasks/conda-env-install.yml
      apply:
        become: true
        become_user: "{{ vm_user }}"
        tags: [siesta]
    vars:
      conda_env: siesta
      packages: [siesta=5.4.2]
      bin_patterns:
      - siesta
      - tbtrans
      - vibra
      - Eig2DOS
      - gnubands
      - fat
      - denchar
      - macroave
      - stm
      - optical

  - name: Install asesma Python conda environment
    tags: [asesma]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/asesma.yml

  - name: Build and install QEpy from source (aarch64 only — no PyPI wheel)
    tags: [qepy]
    when: ansible_facts['architecture'] == 'aarch64'
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/qepy.yml

  - name: Install JupyterLab launcher and desktop shortcut
    tags: [jupyter]
    ansible.builtin.import_tasks: custom/tasks/jupyter.yml

  - name: Clone materials repo and install `update` helper
    tags: [materials]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/materials.yml

  - name: Override bash welcome message for the mini-ASESMA School
    tags: [welcome]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.blockinfile:
      path: "/home/{{ vm_user }}/.bashrc"
      marker: "# {mark} ANSIBLE MANAGED BLOCK (bash welcome message)"
      block: |
        # Print only in non-login shells
        shopt -q login_shell || cat << EOM
        ##############################################################
        # Welcome to Quantum Mobile for the mini-ASESMA School 2026!
        # Distributed by the MARVEL NCCR.
        ##############################################################
        EOM
