---
- name: Build base Quantum Mobile layer
  ansible.builtin.import_playbook: playbook-build-base.yml

- name: Install QE School workshop software
  hosts: "{{ build_hosts | default('vagrant') }}"

  tasks:
  - name: Install jupyter conda environment
    tags: [jupyter]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/jupyter.yml

  - name: Install Koopmans toolchain
    tags: [koopmans]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/koopmans.yml

  - name: Install metatomic conda environment
    tags: [metatomic]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/metatomic.yml

  - name: Install qe conda environment
    tags: [qe]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/qe.yml

  - name: Install wannier conda environment
    tags: [wannier]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/wannier.yml

  - name: Install yambo conda environment
    tags: [yambo]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/yambo.yml

  - name: Install sscha conda environment
    tags: [sscha]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/sscha.yml

  - name: Install pyece conda environment
    tags: [pyece]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/pyece.yml

  - name: Add bash completion for the workon alias
    tags: [workon-completion]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.blockinfile:
      path: "/home/{{ vm_user }}/.bashrc"
      marker: "# {mark} ANSIBLE MANAGED BLOCK (workon completion)"
      block: |
        _workon() {
          COMPREPLY=( $(compgen -W "koopmans metatomic pyece qe sscha wannier yambo" -- "${COMP_WORDS[COMP_CWORD]}") )
        }
        complete -F _workon workon

  - name: Clone materials repo and install cdd/update helpers
    tags: [materials]
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.import_tasks: custom/tasks/materials.yml
