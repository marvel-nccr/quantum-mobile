---
# Mini-ASESMA School packaging entrypoint. Removes the qepy build tree (QE 7.2
# source + objects, no longer needed once the qepy wheel is installed into the
# asesma conda env), runs the generic cache cleanup, then hands off to the
# standard packaging playbook.

- name: Clean up Mini-ASESMA School build artifacts
  hosts: "{{ build_hosts | default('vagrant') }}"

  tasks:
  - name: Remove qepy build tree
    become: true
    become_user: "{{ vm_user }}"
    ansible.builtin.file:
      path: "/home/{{ vm_user }}/tmp/qepy"
      state: absent

  - name: Run generic cache cleanup
    ansible.builtin.import_tasks: local/tasks/clean-caches.yml

- name: Package VM
  ansible.builtin.import_playbook: playbook-package.yml
