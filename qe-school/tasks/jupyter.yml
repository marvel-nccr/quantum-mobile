---

- name: Install jupyter conda environment
  ansible.builtin.include_tasks: local/tasks/conda-env-install.yml
  vars:
    conda_env: jupyter
    packages:
    - jupyterlab=4.5.7
    bin_patterns: ["jupyter", "jupyter-lab"]

- name: "Get home for user: {{ vm_user }}"
  become: true
  become_user: "{{ vm_user }}"
  chrisjsewell.conda.expandpath:
    path: "~"
  register: vm_user_home

- name: Write Jupyter lab launcher script
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.copy:
    dest: "{{ vm_user_home.path }}/.jupyter-lab.sh"
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0755"
    content: |
      #!/bin/bash
      {{ vm_user_home.path }}/.conda/bin/conda run --no-capture-output -n jupyter jupyter-lab \
        -y \
        --notebook-dir={{ vm_user_home.path }} \
        --ip=localhost --port=8891 \
        --ServerApp.token=7c8a1215d6768f78e8300804741bd3883d7b1510159b755e \
        --no-browser

- name: Add Jupyter lab as systemd service
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.template:
    src: files/jupyter.service
    dest: /etc/systemd/system
    owner: root
    group: root
    mode: "0644"
  vars:
    jupyter_user: "{{ vm_user }}"
    jupyter_script: "{{ vm_user_home.path }}/.jupyter-lab.sh"

- name: Start Jupyter lab systemd service
  tags: [ci_skip]
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.systemd:
    name: jupyter
    enabled: true
    masked: false
    daemon-reload: true
    state: started

- name: Copy Jupyter logo
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/local/tasks/images/jupyter-logo.png"
    dest: /usr/share/icons/
    mode: "0644"

- name: Install JupyterLab application shortcut
  become: true
  become_user: "{{ root_user }}"
  ansible.builtin.copy:
    dest: "/usr/share/applications/jupyterlab.desktop"
    mode: "0644"
    content: |
      [Desktop Entry]
      Encoding=UTF-8
      Name=JupyterLab
      Comment=Launch Jupyter Lab Server
      Exec={{ vm_browser }} "http://localhost:8891/?token=7c8a1215d6768f78e8300804741bd3883d7b1510159b755e"
      Icon=/usr/share/icons/jupyter-logo.png
      Type=Application

- name: Copy JupyterLab shortcut to Desktop
  tags: [ci_skip]
  ansible.builtin.copy:
    src: /usr/share/applications/jupyterlab.desktop
    dest: "/home/{{ vm_user }}/Desktop/jupyterlab.desktop"
    remote_src: true
    owner: "{{ vm_user }}"
    group: "{{ vm_user }}"
    mode: "0755"
