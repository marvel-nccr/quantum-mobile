---

- name: Install qe conda environment
  ansible.builtin.include_tasks: local/tasks/conda-env-install.yml
  vars:
    conda_env: qe
    packages:
    - qe=7.5
    - openmpi=5.0.8
    - ase
    - numpy
    - matplotlib
    - spglib
    - ipykernel
    bin_patterns: ["*.x"]

- name: Register qe env as Jupyter kernel
  ansible.builtin.command:
    cmd: >
      ~/.conda/envs/qe/bin/python -m ipykernel install --user
      --name qe --display-name "Python (qe)"
    creates: "/home/{{ vm_user }}/.local/share/jupyter/kernels/qe/kernel.json"

- name: Smoke test qe env imports
  ansible.builtin.command:
    cmd: ~/.conda/envs/qe/bin/python -c "import ase, numpy, matplotlib, spglib"
  changed_when: false
